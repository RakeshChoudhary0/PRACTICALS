<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Dark Calculator</title>
    <style>
      /* CSS Variables for consistent themed colors */
      :root {
        --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --calc-bg: #1e293b;
        --display-bg: #0f172a;
        --btn-num: #334155;
        --btn-num-hover: #475569;
        --btn-op: #3b82f6;
        --btn-op-hover: #2563eb;
        --btn-danger: #ef4444;
        --btn-danger-hover: #dc2626;
        --btn-equal: #10b981;
        --btn-equal-hover: #059669;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-gradient);
      }

      .calculator {
        width: 320px;
        background-color: var(--calc-bg);
        padding: 24px;
        border-radius: 20px;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.4),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .display-container {
        margin-bottom: 20px;
      }

      #display {
        width: 100%;
        height: 64px;
        background-color: var(--display-bg);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        font-size: 2rem;
        font-weight: 600;
        text-align: right;
        padding: 0 16px;
        outline: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      button {
        height: 56px;
        border: none;
        border-radius: 12px;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-main);
        background-color: var(--btn-num);
        cursor: pointer;
        transition: all 0.15s ease-in-out;
        user-select: none;
      }

      button:hover {
        background-color: var(--btn-num-hover);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      /* Functional Color Variants */
      .operator {
        background-color: var(--btn-op);
      }
      .operator:hover {
        background-color: var(--btn-op-hover);
      }

      .clear {
        background-color: var(--btn-danger);
      }
      .clear:hover {
        background-color: var(--btn-danger-hover);
      }

      .equal {
        background-color: var(--btn-equal);
        grid-column: span 2;
      }
      .equal:hover {
        background-color: var(--btn-equal-hover);
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div class="display-container">
        <input type="text" id="display" readonly value="0" />
      </div>

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('.')">.</button>

        <button onclick="appendValue('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");

      function appendValue(val) {
        if (display.value === "0" || display.value === "Error") {
          display.value = val;
        } else {
          display.value = display.value + val;
        }
      }

      function clearDisplay() {
        display.value = "0";
      }

      function deleteLast() {
        display.value = display.value.slice(0, -1);
        if (display.value === "") {
          display.value = "0";
        }
      }

      function calculate() {
        try {
          display.value = eval(display.value);
        } catch (err) {
          display.value = "Error";
        }
      }
    </script>
  </body>
</html>
